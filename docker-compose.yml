services:
  # ── Base de datos ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: satori_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satori_dev}
      POSTGRES_DB: ${POSTGRES_DB:-satoripms}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satori} -d ${POSTGRES_DB:-satoripms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Caché y bloqueos ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: satori_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Orquestación del chatbot ───────────────────────────
  n8n:
    profiles: ["n8n"]
    image: n8nio/n8n:2.47.3
    container_name: satori_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: .env
    environment:
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin123}
      - N8N_PORT=5678
      - N8N_WEBHOOK_URL=${N8N_PUBLIC_URL}
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL}
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=America/Bogota
    volumes:
      - n8n_data:/home/node/.n8n
      - ./flows/n8n:/home/node/.n8n/workflows:ro
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Backend API ────────────────────────────────────────
  api:
    build: ./apps/api
    container_name: satori_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/satoripms
      POSTGRES_USER: ${POSTGRES_USER:-satori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satori_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Seguridad: firma de tokens del personal y llave de servicio del chatbot (n8n)
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (mínimo 32 caracteres) en .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      SATORI_SERVICE_KEY: ${SATORI_SERVICE_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Administrador inicial (opcional): solo se crea si el usuario no existe
      SATORI_ADMIN_USERNAME: ${SATORI_ADMIN_USERNAME:-}
      SATORI_ADMIN_PASSWORD: ${SATORI_ADMIN_PASSWORD:-}
      SATORI_ADMIN_NAME: ${SATORI_ADMIN_NAME:-Administrador}
      GOOGLE_REVIEWS_URL: ${GOOGLE_REVIEWS_URL:-https://www.google.com/travel/hotels/entity/CgsIvsf-mZ_-h-fGARAB/reviews?hl=es-CO&gl=co}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID:-ChIJQRr4FV2zOY4RvqM_8_EfzsY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:

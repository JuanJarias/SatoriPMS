server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/satoripms}
    username: ${POSTGRES_USER:satori}
    password: ${POSTGRES_PASSWORD:satori_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    path: /api-docs

satori:
  redis:
    bloqueo-ttl-segundos: 900
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-cambiar-en-produccion-1234567890}
    expiracion-ms: ${JWT_EXPIRATION_MS:86400000}
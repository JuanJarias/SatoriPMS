server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/satoripms}
    username: ${POSTGRES_USER:satori}
    password: ${POSTGRES_PASSWORD:satori_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    path: /api-docs

satori:
  redis:
    bloqueo-ttl-segundos: 900
  jwt:
    # Clave HMAC-SHA256 de firma de tokens (mínimo 32 caracteres).
    secret: ${JWT_SECRET:dev-secret-key-cambiar-en-produccion-1234567890}
    expiracion-ms: ${JWT_EXPIRATION_MS:28800000}
  security:
    # Llave de servicio que n8n envía en el encabezado X-Service-Key.
    # Si está vacía, ningún cliente puede autenticarse como servicio.
    service-key: ${SATORI_SERVICE_KEY:}
    # Orígenes permitidos por CORS para la aplicación web (separados por coma).
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    # Si ambos valores están definidos y el usuario no existe, se crea un administrador inicial.
    admin-username: ${SATORI_ADMIN_USERNAME:}
    admin-password: ${SATORI_ADMIN_PASSWORD:}
    admin-name: ${SATORI_ADMIN_NAME:Administrador}
  booking:
    test-payment-enabled: ${BOOKING_TEST_PAYMENT_ENABLED:false}
name: CI — Lint, Tests & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ──────────────────────────────────────────────
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Chatbot (flujo n8n + suites en memoria) ───────────────
  chatbot:
    name: Chatbot (integridad del flujo y pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Integridad del flujo V9
        run: python3 tests/chatbot/verify_n8n_flow_integrity.py flows/n8n/V9_ChatbotReservas.json

      - name: Suite integral del chatbot (en memoria)
        run: node tests/chatbot/suite_pruebas_chatbot.js

      - name: Pruebas de cobro Wompi (en memoria)
        run: node tests/chatbot/test_pago_wompi_v9.js

  # ── Backend ───────────────────────────────────────────────
  backend:
    name: Backend (Java 21 + Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: apps/api/pom.xml

      # Las pruebas de persistencia levantan su propio PostgreSQL con Testcontainers
      # (Docker ya viene en el runner), por lo que no se declaran servicios aparte.
      - name: Compile and run tests
        run: mvn -B test
        env:
          ENABLE_DOCKER_TESTS: 'true'

      - name: Package JAR
        run: mvn -B package -DskipTests

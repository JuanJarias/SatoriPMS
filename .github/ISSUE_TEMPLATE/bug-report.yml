name: "🐛 Bug Report"
description: Reportar un fallo o comportamiento inesperado del sistema
title: "[BUG-XX] [Módulo] - "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Reporte de Bug
        Describe el síntoma concreto y reproducible, no la causa supuesta.
        **Formato del título**: `[BUG-XX] [Módulo] - El [componente] no [comportamiento esperado]`

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del problema
      placeholder: "¿Qué pasa? ¿Cuál es el síntoma visible?"
    validations:
      required: true

  - type: textarea
    id: reproduccion
    attributes:
      label: Pasos para reproducir
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
      placeholder: "¿Qué debería pasar?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      placeholder: "¿Qué pasa en cambio?"
    validations:
      required: true

  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Ej: Staging / Producción, Chrome 128, Android 14, Docker local"

  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas de pantalla
      placeholder: "Pega aquí logs relevantes o arrastra capturas de pantalla"

name: "📋 Caso de Uso (CU)"
description: Funcionalidad con flujo definido, actores y excepciones
title: "[CU-XX] [Épica] - "
labels: ["type: cu"]
body:
  - type: markdown
    attributes:
      value: |
        ## Caso de Uso
        Completa los campos según la ficha del documento de requerimientos.
        **Formato del título**: `[CU-XX] [Nombre Épica] - Verbo en infinitivo + resultado observable`

  - type: input
    id: actor
    attributes:
      label: Actor(es)
      placeholder: "Ej: Huésped (vía chatbot), Recepcionista"
    validations:
      required: true

  - type: textarea
    id: precondiciones
    attributes:
      label: Precondiciones
      placeholder: "¿Qué debe ser cierto antes de ejecutar este caso de uso?"
    validations:
      required: true

  - type: textarea
    id: flujo
    attributes:
      label: Flujo básico
      description: Pasos numerados, uno por línea. Actor → Sistema alternando.
      placeholder: |
        1. El huésped indica fechas de entrada y salida.
        2. El sistema muestra las habitaciones disponibles.
        3. ...
    validations:
      required: true

  - type: textarea
    id: alternos
    attributes:
      label: Flujos alternativos (A1, A2…)
      placeholder: |
        **A1**: Si el huésped solicita recomendación de IA → ver HU-09.

  - type: textarea
    id: excepciones
    attributes:
      label: Flujos de excepción (E1, E2…)
      placeholder: |
        **E1**: Habitación no disponible al confirmar → notificar y sugerir alternativas.
        **E2**: Pago rechazado → ofrecer reintento (máximo 3 veces).
    validations:
      required: true

  - type: textarea
    id: postcondiciones
    attributes:
      label: Postcondiciones
      placeholder: "¿Qué es cierto después de que el caso de uso termina exitosamente?"
    validations:
      required: true

  - type: input
    id: reglas
    attributes:
      label: Reglas de negocio aplicables
      placeholder: "RN-01, RN-02, RN-03"

  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - [ ] Endpoint(s) implementados y documentados
        - [ ] Pruebas unitarias de las reglas de negocio
        - [ ] Flujos de excepción cubiertos y probados
        - [ ] Probado en móvil si tiene interfaz de usuario
        - [ ] PR revisado y aprobado por otro integrante
        - [ ] CI en verde

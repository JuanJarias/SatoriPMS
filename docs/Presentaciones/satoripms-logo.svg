<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" fill="none">
  <!-- Símbolo Torre Satori (Isotipo arquitectónico minimalista) -->
  <g transform="translate(8, 6)">
    <!-- Base / Fundación -->
    <rect x="6" y="48" width="48" height="6" rx="3" fill="#6d4c41"/>
    <!-- Nivel 1 (Piso 1) -->
    <rect x="12" y="34" width="36" height="10" rx="2" fill="#8d6e63"/>
    <!-- Nivel 2 (Piso 2) -->
    <rect x="16" y="20" width="28" height="10" rx="2" fill="#a1887f"/>
    <!-- Nivel 3 / Techo Zen (Piso 3) -->
    <path d="M14 16 L30 6 L46 16 Z" fill="#d7ccc8"/>
    <!-- Núcleo vertical estilizado (Puerta / Viga de equilibrio) -->
    <rect x="27" y="14" width="6" height="34" rx="1.5" fill="#d4a373"/>
    <!-- Acento dorado en cúspide -->
    <circle cx="30" cy="5" r="2.5" fill="#f3d5b5"/>
  </g>

  <!-- Tipografía del Logotipo -->
  <text x="76" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="1.5" fill="#fcfaf7">SATORI</text>
  
  <!-- Badge PMS en tono café dorado -->
  <rect x="208" y="18" width="58" height="24" rx="5" fill="#5c3d2e" stroke="#d4a373" stroke-width="1.2"/>
  <text x="216" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#f3d5b5">PMS</text>
  
  <!-- Subtítulo institucional -->
  <text x="78" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="2.2" fill="#d4a373" text-transform="uppercase">Hotel Torre Satori · Sevilla</text>
</svg>
